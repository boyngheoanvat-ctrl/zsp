name: Build ERI COC V5.1 Match Fix APK
on:
  push:
    branches:
      - eri-coc-v5-match-fix
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble new APK
        working-directory: eri-battle-v2
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ERI_COC_V5_1_MATCH_FIX_APK
          path: eri-battle-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
