plugins { id 'com.android.application' }
android {
    namespace 'com.eri.battlebot'
    compileSdk 35
    defaultConfig {
        applicationId 'com.eri.battlebot'
        minSdk 30
        targetSdk 32
        versionCode 1
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
