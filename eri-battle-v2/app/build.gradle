plugins { id 'com.android.application' }
android {
    namespace 'com.eri.battlebot'
    compileSdk 35
    defaultConfig {
        applicationId 'com.eri.battlebot'
        minSdk 30
        targetSdk 32
        versionCode 5
        versionName '5.0-overlay'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled OCR model: inspect result buttons on the device, no upload.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
